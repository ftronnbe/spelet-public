<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost – Deep Regrats</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0a0f">
<style>
  /* Self-contained: a 404 can be served from any path, so it does not rely on relative links to the stylesheet. */
  html { color-scheme: dark; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 24px 16px;
    background: radial-gradient(60% 50% at 50% 60%, rgba(255, 140, 50, .18), transparent 70%), #0c0a0f; color: #ece4d6;
    font: 1.15rem/1.6 "Gill Sans", "Segoe UI", system-ui, sans-serif; }
  h1 { margin: 0; font: 900 clamp(4rem, 18vw, 9rem)/1 Georgia, serif; letter-spacing: .04em;
    background: linear-gradient(#ffe2a0, #e8b64c 55%, #a8741f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: #b9ae9f; max-width: 34ch; margin: 12px auto 26px; }
  a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: #e8b64c; color: #1d1204; font-weight: 800; text-decoration: none; }
  a:focus-visible { outline: 3px solid #ffe2a0; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>This floor does not exist. Kevin checked. He is not going to check again.</p>
  <a id="home" href="/spelet-public/">Back to the surface</a>
</main>
<script>
  // On a custom domain the site lives at the root, on github.io under /spelet-public/.
  if (!location.hostname.endsWith("github.io")) document.getElementById("home").href = "/";
</script>
</body>
</html>
